<div class="w-full h-full flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-zinc-100">Wpaperd</h1>
            <p class="text-sm text-zinc-500">Configure wallpaper daemon</p>
        </div>
        <div class="flex items-center gap-3">
            <!-- Preset Manager Container -->
            <div id="preset-container"></div>

            <!-- Quick Controls -->
            <div class="flex items-center gap-1 bg-zinc-900 border border-zinc-800 rounded-lg p-1">
                <button onclick="wpaperdEditor.control('previous')" title="Previous Wallpaper"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ⏮️
                </button>
                <button onclick="wpaperdEditor.control('toggle-pause')" title="Toggle Pause"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ⏯️
                </button>
                <button onclick="wpaperdEditor.control('next')" title="Next Wallpaper"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ⏭️
                </button>
            </div>

            <button onclick="wpaperdEditor.restart()"
                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg font-medium flex items-center gap-2 border border-zinc-700">
                <span>🔄</span> Reload
            </button>
            <button onclick="wpaperdEditor.save()"
                class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg font-medium flex items-center gap-2">
                <span>💾</span> Save
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex gap-6 overflow-hidden">
        <!-- Displays List -->
        <div class="w-64 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white">Displays</h2>
                <button onclick="wpaperdEditor.addDisplay()" class="text-teal-500 hover:text-teal-400 text-sm">+
                    Add</button>
            </div>
            <div id="displays-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Populated by JS -->
                <div class="text-zinc-500 text-center py-10">Loading...</div>
            </div>
        </div>

        <!-- Display Settings -->
        <div class="flex-1 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80">
                <h2 id="display-title" class="text-lg font-semibold text-white">Select a display</h2>
            </div>
            <div id="display-settings" class="flex-1 overflow-y-auto p-4">
                <div class="flex flex-col items-center justify-center h-full text-zinc-500 gap-2">
                    <span class="text-4xl">🖼️</span>
                    <p class="text-sm">Select a display to configure</p>
                </div>
            </div>
        </div>

        <!-- Current Wallpaper Preview -->
        <div class="w-80 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80">
                <h2 class="text-lg font-semibold text-white">Current</h2>
            </div>
            <div id="current-preview" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-zinc-500 text-center py-10">Loading...</div>
            </div>
        </div>
    </div>
</div>

<script src="/scripts/wpaperd.js?k={{ cache_key }}"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (!window.wpaperdEditor) {
            window.wpaperdEditor = new WpaperdEditor();
        }
    });
</script>
