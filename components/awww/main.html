<div class="w-full h-full flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-zinc-100">Awww Wallpaper Daemon</h1>
            <p class="text-sm text-zinc-500">Configure Wayland wallpaper settings, dynamic transitions & Matugen colors
            </p>
        </div>
        <div class="flex items-center gap-3">
            <!-- Preset Manager Container -->
            <div id="preset-container"></div>

            <!-- Quick Controls -->
            <div class="flex items-center gap-1 bg-zinc-900 border border-zinc-800 rounded-lg p-1">
                <button onclick="awwwEditor.control('toggle')" title="Toggle Daemon"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ⏯️
                </button>
                <button onclick="awwwEditor.control('pause')" title="Pause Daemon"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ⏸️
                </button>
                <button onclick="awwwEditor.control('unpause')" title="Unpause Daemon"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ▶️
                </button>
                <button onclick="awwwEditor.control('clear')" title="Clear Display"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    🧹
                </button>
                <button onclick="awwwEditor.control('restore')" title="Restore Last Wallpaper"
                    class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition-colors">
                    ↺
                </button>
            </div>

            <button onclick="awwwEditor.applyMatugenTheme()"
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium flex items-center gap-2 border border-indigo-500/50">
                <span>🎨</span> Apply Matugen Theme
            </button>
            <button onclick="awwwEditor.restart()"
                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg font-medium flex items-center gap-2 border border-zinc-700">
                <span>🔄</span> Reload Daemon
            </button>
            <button onclick="awwwEditor.save()"
                class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg font-medium flex items-center gap-2">
                <span>💾</span> Save
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex gap-6 overflow-hidden">
        <!-- Displays List -->
        <div class="w-64 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white">Displays</h2>
                <button onclick="awwwEditor.addDisplay()"
                    class="text-teal-500 hover:text-teal-400 text-sm font-medium">+ Add</button>
            </div>
            <div id="displays-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-zinc-500 text-center py-10">Loading displays...</div>
            </div>
        </div>

        <!-- Display Settings Editor & Matugen Card -->
        <div class="flex-1 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80 flex items-center justify-between">
                <h2 id="display-title" class="text-lg font-semibold text-white">Select a display</h2>
                <div id="display-actions" class="hidden">
                    <button onclick="awwwEditor.deleteCurrentDisplay()"
                        class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded bg-red-950/40 border border-red-900/50">Remove</button>
                </div>
            </div>
            <div id="display-settings" class="flex-1 overflow-y-auto p-6 space-y-6">
                <div class="flex flex-col items-center justify-center h-full text-zinc-500 gap-2">
                    <span class="text-4xl">🖼️</span>
                    <p class="text-sm">Select a display to configure settings</p>
                </div>
            </div>
        </div>

        <!-- Current Wallpaper Preview & Matugen Swatch -->
        <div class="w-80 flex flex-col bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800 bg-zinc-900/80 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white">Active Status</h2>
                <button onclick="awwwEditor.loadCurrent()" title="Refresh"
                    class="text-zinc-400 hover:text-white text-xs">🔄</button>
            </div>
            <div id="current-preview" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="text-zinc-500 text-center py-10">Loading status...</div>
            </div>

            <!-- Matugen Palette Card -->
            <div class="border-t border-zinc-800 p-4 bg-zinc-950/90 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-zinc-200 flex items-center gap-1.5">
                        <span>🎨</span> Matugen Palette (1st Screen)
                    </h3>
                    <button onclick="awwwEditor.refreshMatugenPalette()"
                        class="text-indigo-400 hover:text-indigo-300 text-xs font-medium">Generate</button>
                </div>
                <div id="matugen-swatch-container"
                    class="rounded-lg overflow-hidden border border-zinc-800 bg-zinc-900 aspect-[80/26] flex items-center justify-center">
                    <span class="text-xs text-zinc-500">Click Generate to preview palette</span>
                </div>
                <div class="flex items-center justify-between text-xs gap-2">
                    <select id="matugen-mode-select" onchange="awwwEditor.refreshMatugenPalette()"
                        class="bg-zinc-900 border border-zinc-700/80 text-zinc-300 rounded px-2 py-1 text-xs">
                        <option value="dark">Dark Mode</option>
                        <option value="light">Light Mode</option>
                    </select>
                    <select id="matugen-type-select" onchange="awwwEditor.refreshMatugenPalette()"
                        class="bg-zinc-900 border border-zinc-700/80 text-zinc-300 rounded px-2 py-1 text-xs truncate max-w-[140px]">
                        <option value="scheme-tonal-spot">Tonal Spot</option>
                        <option value="scheme-vibrant">Vibrant</option>
                        <option value="scheme-expressive">Expressive</option>
                        <option value="scheme-fidelity">Fidelity</option>
                        <option value="scheme-monochrome">Monochrome</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/scripts/awww.js?k={{ cache_key }}"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (!window.awwwEditor) {
            window.awwwEditor = new AwwwEditor();
        }
    });
</script>
