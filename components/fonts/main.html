<div class="w-full h-full flex flex-col relative">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 gap-4">
        <h1 class="text-2xl font-bold text-zinc-100 whitespace-nowrap">Browser Fonts</h1>

        <!-- Tabs -->
        <div class="flex bg-zinc-800 rounded-lg p-1 gap-1">
            <button id="tab-available" onclick="window._fontPreview.switchTab('available')"
                class="px-4 py-1.5 text-sm rounded-md transition-colors bg-zinc-700 text-white font-medium shadow-sm">
                Available
            </button>
            <button id="tab-pinned" onclick="window._fontPreview.switchTab('pinned')"
                class="px-4 py-1.5 text-sm rounded-md transition-colors text-zinc-400 hover:text-zinc-200">
                Pinned
            </button>
        </div>

        <div class="relative w-64">
            <input type="text" id="font-search" placeholder="Search fonts..."
                class="w-full bg-zinc-800 text-zinc-200 text-sm rounded-md px-3 py-2 border border-zinc-700 focus:outline-none focus:border-teal-500 transition-colors"
                oninput="window._fontPreview.handleSearch(this.value)">
            <div class="absolute right-3 top-2.5 text-zinc-500 text-xs">
                🔍
            </div>
        </div>
    </div>

    <!-- Font Grid -->
    <div id="font-grid"
        class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 content-start">
        <!-- populated by js -->
        <div class="col-span-full text-center text-zinc-500 py-10">Loading fonts...</div>
    </div>

    <!-- Status Bar -->
    <div class="mt-4 flex items-center justify-between text-xs text-zinc-500">
        <span id="font-count">0 fonts</span>
        <span>Preview text: "The quick brown fox..." (Default)</span>
    </div>
</div>

<script>
    class FontPreview {
        constructor() {
            this.fonts = [];
            this.activeTab = 'available'; // 'available' | 'pinned'
            this.lastQuery = '';
            this.displayCount = 50;
            this.batchSize = 50;
            this.isLoading = false;

            this.grid = document.getElementById('font-grid');
            this.countEl = document.getElementById('font-count');
            this.init();
        }

        async init() {
            try {
                // Ensure pinned fonts are loaded first
                if (window.fontManager && !window.fontManager.pinnedFonts.size) {
                    await window.fontManager.loadPinnedFonts();
                }

                const res = await fetch('/fonts/list');
                const data = await res.json();

                if (Array.isArray(data)) {
                    const uniqueFamilies = new Set();
                    data.forEach(item => {
                        item.families.forEach(f => uniqueFamilies.add(f));
                    });

                    this.fonts = Array.from(uniqueFamilies).sort();
                    this.render();
                    
                    // Setup scroll listener
                    this.grid.addEventListener('scroll', () => this.handleScroll());
                }
            } catch (e) {
                console.error("Failed to load font list for preview", e);
                this.grid.innerHTML = `<div class="col-span-full text-red-500 text-center">Failed to load fonts</div>`;
            }
        }

        switchTab(tab) {
            this.activeTab = tab;
            this.displayCount = 50; // Reset on tab switch

            // Update Tab UI
            const btnAvailable = document.getElementById('tab-available');
            const btnPinned = document.getElementById('tab-pinned');

            if (tab === 'available') {
                btnAvailable.className = "px-4 py-1.5 text-sm rounded-md transition-colors bg-zinc-700 text-white font-medium shadow-sm";
                btnPinned.className = "px-4 py-1.5 text-sm rounded-md transition-colors text-zinc-400 hover:text-zinc-200";
            } else {
                btnAvailable.className = "px-4 py-1.5 text-sm rounded-md transition-colors text-zinc-400 hover:text-zinc-200";
                btnPinned.className = "px-4 py-1.5 text-sm rounded-md transition-colors bg-zinc-700 text-white font-medium shadow-sm";
            }

            this.grid.scrollTop = 0;
            this.render();
        }

        handleSearch(query) {
            this.lastQuery = query.toLowerCase();
            this.displayCount = 50; // Reset on search
            this.grid.scrollTop = 0;
            this.render();
        }

        getFilteredList() {
            let list = this.fonts;

            // 1. Filter by Tab
            if (this.activeTab === 'pinned') {
                const pinnedSet = window.fontManager ? window.fontManager.pinnedFonts : new Set();
                list = list.filter(f => pinnedSet.has(f));
            }

            // 2. Filter by Search
            if (this.lastQuery) {
                list = list.filter(f => f.toLowerCase().includes(this.lastQuery));
            }

            return list;
        }

        handleScroll() {
            if (this.isLoading) return;
            
            const list = this.getFilteredList();
            if (this.displayCount >= list.length) return; // All loaded
            
            // Check if near bottom (within 150px)
            const scrollBottom = this.grid.scrollTop + this.grid.clientHeight;
            const threshold = this.grid.scrollHeight - 150;
            
            if (scrollBottom >= threshold) {
                this.loadMore();
            }
        }

        loadMore() {
            this.isLoading = true;
            this.displayCount += this.batchSize;
            this.render();
            this.isLoading = false;
        }

        render() {
            const list = this.getFilteredList();
            const shownList = list.slice(0, this.displayCount);

            this.countEl.textContent = `${list.length} fonts`;

            if (list.length === 0) {
                const msg = this.activeTab === 'pinned'
                    ? "No pinned fonts yet. Star some fonts in the 'Available' tab!"
                    : "No fonts found";
                this.grid.innerHTML = `<div class="col-span-full text-zinc-500 text-center py-10">${msg}</div>`;
                return;
            }

            // Access global font manager
            const isPinned = (family) => {
                return window.fontManager && window.fontManager.isPinned(family);
            };

            let html = shownList.map(family => {
                const pinned = isPinned(family);
                const starColor = pinned ? 'text-yellow-400 fill-yellow-400' : 'text-zinc-600 hover:text-zinc-400';

                return `
                <div class="bg-zinc-800/50 border border-zinc-700/50 rounded-lg p-4 hover:border-teal-500/50 hover:bg-zinc-800 transition-all flex flex-col gap-2 group relative">
                    
                    <!-- Copy Overlay -->
                    <div class="absolute inset-0 z-0 cursor-pointer" onclick="window._fontPreview.copyFont('${family.replace(/'/g, "\\'")}')"></div>

                    <!-- Pin Button (z-10 to stay above copy overlay) -->
                    <button onclick="window._fontPreview.togglePin('${family.replace(/'/g, "\\'")}', this)" 
                            class="absolute top-2 right-2 z-10 p-1.5 rounded-md transition-colors ${starColor}">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </button>
                    
                    <div class="absolute top-2 right-10 opacity-0 group-hover:opacity-100 transition-opacity text-xs bg-teal-500 text-black px-2 py-0.5 rounded font-medium pointer-events-none">
                        Click card to copy
                    </div>

                    <div class="text-xs text-zinc-500 font-mono truncate group-hover:text-teal-400 transition-colors pointer-events-none" title="${family}">${family}</div>
                    <div class="text-xl text-zinc-200 truncate pointer-events-none" style="font-family: '${family}', sans-serif;">
                        The quick brown fox
                    </div>
                    <div class="text-lg text-zinc-400 truncate pointer-events-none" style="font-family: '${family}', sans-serif;">
                        1234567890
                    </div>
                </div>
            `}).join('');

            // Show loader if more available
            if (shownList.length < list.length) {
                html += `
                    <div id="font-loader" class="col-span-full flex justify-center py-4">
                        <span class="text-zinc-500 text-sm">Scroll for more... (${shownList.length}/${list.length})</span>
                    </div>
                `;
            }

            this.grid.innerHTML = html;
        }

        async copyFont(family) {
            try {
                await navigator.clipboard.writeText(family);
                showToast(`Copied "${family}" to clipboard`, 'success');
            } catch (err) {
                console.error('Failed to copy', err);
                showToast('Failed to copy', 'error');
            }
        }

        togglePin(family, btn) {
            if (window.event) window.event.stopPropagation();

            if (window.fontManager) {
                const isNowPinned = window.fontManager.togglePin(family);
                const svg = btn.querySelector('svg');

                if (isNowPinned) {
                    btn.classList.add('text-yellow-400', 'fill-yellow-400');
                    btn.classList.remove('text-zinc-600', 'hover:text-zinc-400');
                    if (svg) svg.classList.add('fill-current');
                } else {
                    btn.classList.remove('text-yellow-400', 'fill-yellow-400');
                    btn.classList.add('text-zinc-600', 'hover:text-zinc-400');
                    if (svg) svg.classList.remove('fill-current');
                }
            }
        }
    }

    // Defer slightly to ensure DOM is ready inside the component container
    setTimeout(() => {
        window._fontPreview = new FontPreview();
    }, 100);
</script>
