<div class="flex flex-col h-full bg-zinc-950 text-white overflow-hidden font-sans selection:bg-teal-500/30">
    <!-- TOP: Visual Preview -->
    <div class="h-48 shrink-0 border-b border-zinc-800 bg-zinc-900/40 p-6 flex flex-col gap-3 relative">
        <div class="flex items-center justify-between z-10">
            <div class="flex items-center gap-2">
                <div class="w-2 h-8 bg-teal-500 rounded-full"></div>
                <h3 class="text-sm font-bold text-zinc-300 uppercase tracking-widest">Visual Bar Preview</h3>

                <!-- Zone Toggles -->
                <div class="flex items-center gap-1 ml-4 bg-zinc-900/80 rounded-lg p-0.5 border border-zinc-800"
                    id="zone-toggles">
                    <button
                        class="px-2 py-0.5 text-[10px] font-bold uppercase rounded hover:bg-zinc-800 text-teal-400 border border-teal-500/30 transition-all active-zone"
                        data-zone="modules-left" data-target="zone-left">
                        Left
                    </button>
                    <button
                        class="px-2 py-0.5 text-[10px] font-bold uppercase rounded hover:bg-zinc-800 text-teal-400 border border-teal-500/30 transition-all active-zone"
                        data-zone="modules-center" data-target="zone-center">
                        Center
                    </button>
                    <button
                        class="px-2 py-0.5 text-[10px] font-bold uppercase rounded hover:bg-zinc-800 text-teal-400 border border-teal-500/30 transition-all active-zone"
                        data-zone="modules-right" data-target="zone-right">
                        Right
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-4 text-xs text-zinc-500">
                <span class="flex items-center gap-1"><kbd
                        class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700 font-mono">Drag</kbd> to
                    reorder</span>
                <span class="flex items-center gap-1"><kbd
                        class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700 font-mono">Toggle</kbd>
                    zones</span>
            </div>
        </div>

        <!-- The Bar Itself -->
        <!-- Fixed height container with scroll -->
        <div class="h-14 shrink-0 rounded-xl border border-zinc-800/60 bg-black/40 backdrop-blur-xl flex items-center px-4 relative shadow-2xl ring-1 ring-white/5 overflow-x-auto scrollbar-thin scrollbar-thumb-zinc-700 scrollbar-track-transparent"
            id="visual-bar">

            <!-- Left Zone -->
            <div id="zone-left"
                class="flex items-center gap-1 h-9 px-2 rounded-lg border border-dashed border-zinc-800/50 bg-zinc-900/10 hover:bg-zinc-800/30 hover:border-zinc-700 transition-all duration-200 min-w-[50px]"
                data-position="modules-left">
                <!-- Modules go here -->
            </div>

            <!-- Spacer (flexible) -->
            <div class="flex-1 min-w-[20px]"></div>

            <!-- Center Zone -->
            <div id="zone-center"
                class="flex items-center gap-1 h-9 px-2 rounded-lg border border-dashed border-zinc-800/50 bg-zinc-900/10 hover:bg-zinc-800/30 hover:border-zinc-700 transition-all duration-200 min-w-[50px] justify-center"
                data-position="modules-center">
            </div>

            <!-- Spacer (flexible) -->
            <div class="flex-1 min-w-[20px]"></div>

            <!-- Right Zone -->
            <div id="zone-right"
                class="flex items-center justify-end gap-1 h-9 px-2 rounded-lg border border-dashed border-zinc-800/50 bg-zinc-900/10 hover:bg-zinc-800/30 hover:border-zinc-700 transition-all duration-200 min-w-[50px]"
                data-position="modules-right">
            </div>
        </div>

        <!-- Background decoration -->
        <div class="absolute inset-0 bg-gradient-to-b from-teal-500/5 to-transparent pointer-events-none"></div>
    </div>

    <!-- BOTTOM: Split View -->
    <div class="flex-1 flex overflow-hidden">
        <!-- LEFT: Module Library -->
        <div class="w-80 shrink-0 border-r border-zinc-800 bg-zinc-900/20 flex flex-col backdrop-blur-sm">
            <div class="p-4 border-b border-zinc-800/80 bg-zinc-900/50 sticky top-0 z-10 backdrop-blur">
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    Module Library
                </h3>
                <div class="relative group">
                    <input type="text" id="search-modules" placeholder="Search components..."
                        class="w-full bg-zinc-950/50 text-zinc-200 rounded-lg pl-9 pr-3 py-2.5 border border-zinc-800 outline-none transition-all focus:border-teal-500/50 focus:ring-2 focus:ring-teal-500/10 focus:bg-zinc-900 placeholder:text-zinc-600 text-sm">
                    <svg class="w-4 h-4 text-zinc-500 absolute left-3 top-3 group-focus-within:text-teal-500 transition-colors"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 scrollbar-thin scrollbar-thumb-zinc-700 scrollbar-track-zinc-900/50">
                <div class="text-[10px] font-bold text-zinc-600 uppercase tracking-wider mb-2 px-1 mt-1">Available
                    Modules</div>
                <div id="module-library" class="grid grid-cols-1 gap-2 pb-10">
                    <!-- Draggable library items -->
                </div>
            </div>
        </div>

        <!-- RIGHT: Settings/Properties -->
        <div class="flex-1 flex flex-col bg-zinc-950 relative">
            <!-- Header -->
            <div
                class="h-16 shrink-0 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900/30 backdrop-blur-sm z-20">
                <div class="flex items-center gap-4 flex-1 min-w-0">
                    <div id="selected-icon"
                        class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-500 transition-all duration-300">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                    </div>
                    <div class="flex flex-col min-w-0">
                        <h2 id="module-title" class="text-sm font-semibold text-zinc-200 truncate">Settings</h2>
                        <p id="module-type-display" class="text-xs text-zinc-500 truncate">Select a module to configure
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Preset Container Injection Point -->
                    <div id="preset-container" class="mr-2"></div>

                    <div class="h-6 w-px bg-zinc-800 mx-1"></div>

                    <button id="save-btn"
                        class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-500 hover:to-teal-400 text-white text-xs font-bold uppercase tracking-wide rounded-lg transition-all shadow-lg shadow-teal-900/20 active:scale-95 group">
                        <svg class="w-3.5 h-3.5 group-hover:animate-pulse" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        Save Config
                    </button>
                </div>
            </div>

            <!-- TABS -->
            <div class="px-6 pt-4 bg-zinc-950 sticky top-0 z-10 border-b border-zinc-800/50">
                <div class="flex gap-6">
                    <button id="tab-simple"
                        class="pb-3 text-xs font-medium text-teal-500 border-b-2 border-teal-500 transition-colors">Configuration</button>
                    <button id="tab-style"
                        class="pb-3 text-xs font-medium text-zinc-500 border-b-2 border-transparent hover:text-zinc-300 transition-colors">Visual
                        Style</button>
                    <button id="tab-script"
                        class="pb-3 text-xs font-medium text-zinc-500 border-b-2 border-transparent hover:text-zinc-300 transition-colors hidden">Script
                        Logic</button>
                    <button id="tab-json"
                        class="pb-3 text-xs font-medium text-zinc-500 border-b-2 border-transparent hover:text-zinc-300 transition-colors">Raw
                        JSON</button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-6 scrollbar-thin scrollbar-thumb-zinc-800 scrollbar-track-transparent bg-zinc-950/50"
                id="settings-scroll-area">

                <!-- EMPTY STATE -->
                <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-zinc-600">
                    <div
                        class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-4 shadow-xl">
                        <svg class="w-8 h-8 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        </svg>
                    </div>
                    <p class="text-sm">Select a module from the Visual Bar to configure it</p>
                </div>

                <!-- SIMPLE SETTINGS -->
                <div id="view-simple" class="hidden max-w-2xl"></div>

                <!-- SCRIPT EDITOR -->
                <div id="view-script" class="hidden flex flex-col h-full gap-4">
                    <!-- Toolbar -->
                    <div class="flex items-center gap-3">
                        <select id="script-selector"
                            class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-300 outline-none focus:border-teal-500/50">
                            <option value="">Select a script...</option>
                        </select>
                        <button id="new-script-btn"
                            class="p-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>

                    <!-- Editor -->
                    <div
                        class="flex-1 flex flex-col relative rounded-xl border border-zinc-800 overflow-hidden bg-zinc-900/30">
                        <input type="text" id="script-filename"
                            class="w-full bg-zinc-900 px-4 py-2 text-xs font-mono text-zinc-400 border-b border-zinc-800/50 focus:outline-none focus:text-teal-400"
                            placeholder="script_name.sh" disabled>
                        <textarea id="script-editor"
                            class="flex-1 w-full bg-transparent p-4 text-sm font-mono text-zinc-300 resize-none focus:outline-none spellcheck-false"
                            placeholder="#!/bin/bash\necho 'Hello World'"></textarea>

                        <!-- Actions -->
                        <div
                            class="p-2 bg-zinc-900/80 border-t border-zinc-800 flex justify-between items-center gap-2">
                            <div class="text-[10px] text-zinc-500 px-2">Ctrl+S to save</div>
                            <div class="flex gap-2">
                                <button id="run-script-btn"
                                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-emerald-500 text-xs font-bold transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    Run
                                </button>
                                <button id="save-script-btn"
                                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 text-xs font-bold transition-colors">
                                    Save File
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Console -->
                    <div class="h-32 shrink-0 rounded-xl border border-zinc-800 bg-zinc-950 p-3 font-mono text-xs overflow-y-auto"
                        id="script-console">
                        <div class="text-zinc-600 italic">Output will appear here...</div>
                    </div>
                </div>

                <!-- STYLE EDITOR -->
                <div id="view-style" class="hidden max-w-2xl">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="col-span-2 p-4 rounded-xl bg-zinc-900/50 border border-zinc-800">
                            <label
                                class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3">Colors</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Text Color</label>
                                    <div class="flex items-center gap-2">
                                        <div
                                            class="relative w-8 h-8 rounded-lg overflow-hidden border border-zinc-700 shadow-sm">
                                            <input type="color" id="style-color-picker"
                                                class="absolute inset-0 w-[150%] h-[150%] -top-1/4 -left-1/4 cursor-pointer p-0 border-none">
                                        </div>
                                        <input type="text" id="style-color"
                                            class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                            placeholder="#ffffff">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Background</label>
                                    <div class="flex items-center gap-2">
                                        <div
                                            class="relative w-8 h-8 rounded-lg overflow-hidden border border-zinc-700 shadow-sm">
                                            <input type="color" id="style-bg-picker"
                                                class="absolute inset-0 w-[150%] h-[150%] -top-1/4 -left-1/4 cursor-pointer p-0 border-none">
                                        </div>
                                        <input type="text" id="style-bg"
                                            class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                            placeholder="transparent">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-span-2 p-4 rounded-xl bg-zinc-900/50 border border-zinc-800">
                            <label
                                class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3">Dimensions &
                                Spacing</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Font Size</label>
                                    <input type="text" id="style-font-size"
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                        placeholder="13px">
                                </div>
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Padding</label>
                                    <input type="text" id="style-padding"
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                        placeholder="0 10px">
                                </div>
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Border Radius</label>
                                    <input type="text" id="style-radius"
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                        placeholder="4px">
                                </div>
                                <div>
                                    <label class="block text-xs text-zinc-400 mb-1.5">Margin</label>
                                    <input type="text" id="style-margin"
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-300 font-mono focus:border-teal-500/50 focus:outline-none transition-colors"
                                        placeholder="0 5px">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rounded-xl border border-zinc-800 overflow-hidden bg-zinc-900/50">
                        <div class="px-4 py-3 border-b border-zinc-800/50 bg-zinc-900">
                            <label class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Custom CSS</label>
                        </div>
                        <textarea id="module-custom-css"
                            class="w-full h-48 bg-zinc-950 p-4 font-mono text-sm text-zinc-400 focus:outline-none resize-none"
                            placeholder="border-bottom: 2px solid #555; ..."></textarea>
                    </div>
                </div>

                <!-- JSON EDITOR -->
                <div id="view-json" class="hidden">
                    <div class="rounded-xl border border-zinc-800 overflow-hidden bg-zinc-900/50">
                        <div class="px-4 py-3 border-b border-zinc-800/50 bg-zinc-900">
                            <label class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Configuration
                                JSON</label>
                        </div>
                        <textarea id="module-config"
                            class="w-full h-96 bg-zinc-950 p-4 font-mono text-sm text-zinc-400 focus:outline-none resize-none"
                            spellcheck="false"></textarea>
                    </div>
                </div>

                <div id="status-msg"
                    class="fixed bottom-6 right-6 px-4 py-2 bg-zinc-900 border border-zinc-700 text-white rounded-lg shadow-2xl opacity-0 transition-opacity pointer-events-none z-50 text-sm font-medium">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/scripts/waybar.js?k={{ cache_key }}"></script>
